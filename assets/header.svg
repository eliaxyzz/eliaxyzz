<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Elia Dallanoce — Senior Software Engineer and UI Designer">
  <title>Elia Dallanoce — Senior Software Engineer &amp; UI Designer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="55%" stop-color="#162C36"/>
      <stop offset="100%" stop-color="#1A303A"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#00F5FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#DFF9FC"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <linearGradient id="ruleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#00F5FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00F5FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#8B9BB4" stroke-width="0.5" stroke-opacity="0.16"/>
    </pattern>

    <linearGradient id="gridMaskGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="800" height="250" fill="url(#gridMaskGrad)"/>
    </mask>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="microGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="800" height="250" rx="16"/>
    </clipPath>

    <style>
      .t-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 52px;
        font-weight: 800;
        letter-spacing: -1.2px;
      }
      .t-sub {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 15.5px;
        font-weight: 500;
        letter-spacing: 2.6px;
        fill: #8B9BB4;
      }
      .t-kicker {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 4px;
        fill: #00F5FF;
        fill-opacity: 0.75;
      }
      .t-meta {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10.5px;
        letter-spacing: 1.6px;
        fill: #8B9BB4;
        fill-opacity: 0.55;
      }

      /* ---- breathing / floating ---- */
      @keyframes float-a { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
      @keyframes float-b { 0%,100% { transform: translateY(0); } 50% { transform: translateY(9px); } }
      @keyframes float-c { 0%,100% { transform: translateY(-4px); } 50% { transform: translateY(6px); } }

      .float-a { animation: float-a 7s ease-in-out infinite; }
      .float-b { animation: float-b 9s ease-in-out infinite; }
      .float-c { animation: float-c 11s ease-in-out infinite; }

      /* ---- pulsing glow ---- */
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes pulse-soft { 0%,100% { opacity: 0.18; } 50% { opacity: 0.55; } }
      @keyframes halo-breathe { 0%,100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.07); } }

      .pulse { animation: pulse 3.6s ease-in-out infinite; }
      .pulse-slow { animation: pulse 5.4s ease-in-out infinite; }
      .pulse-soft { animation: pulse-soft 6s ease-in-out infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo-breathe 8s ease-in-out infinite; }

      /* ---- title glow ---- */
      @keyframes title-glow { 0%,100% { opacity: 0.28; } 50% { opacity: 0.62; } }
      .title-aura { animation: title-glow 4.5s ease-in-out infinite; }

      /* ---- stroke drawing ---- */
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes dash-flow { to { stroke-dashoffset: -400; } }

      .draw-rule {
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        animation: draw 2.2s cubic-bezier(.22,.8,.24,1) forwards;
      }
      .trace {
        stroke-dasharray: 420;
        stroke-dashoffset: 420;
        animation: draw 4s ease-in-out infinite alternate;
      }
      .wave-flow {
        stroke-dasharray: 14 10;
        animation: dash-flow 9s linear infinite;
      }
      .circuit {
        stroke-dasharray: 6 8;
        animation: dash-flow 14s linear infinite;
      }
      .ring-spin { transform-box: fill-box; transform-origin: center; animation: spin 22s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .ring-spin-rev { transform-box: fill-box; transform-origin: center; animation: spin 34s linear infinite reverse; }

      /* ---- scan sweep ---- */
      @keyframes sweep { 0% { transform: translateX(-260px); } 100% { transform: translateX(1060px); } }
      .sweep { animation: sweep 9s ease-in-out infinite; }

      /* ---- caret ---- */
      @keyframes blink { 0%,45% { opacity: 1; } 55%,100% { opacity: 0; } }
      .caret { animation: blink 1.1s step-end infinite; }

      @media (prefers-reduced-motion: reduce) {
        .float-a, .float-b, .float-c, .pulse, .pulse-slow, .pulse-soft,
        .halo, .title-aura, .wave-flow, .circuit, .ring-spin, .ring-spin-rev,
        .sweep, .caret { animation: none; }
        .draw-rule, .trace { stroke-dashoffset: 0; animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="800" height="250" fill="url(#bg)"/>
    <rect width="800" height="250" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- Ambient halos -->
    <g class="halo">
      <ellipse cx="655" cy="120" rx="215" ry="150" fill="url(#halo)"/>
    </g>
    <g class="halo" style="animation-duration:11s">
      <ellipse cx="90" cy="215" rx="180" ry="120" fill="url(#halo)"/>
    </g>

    <!-- Sine waves (drawn / flowing) -->
    <g fill="none" stroke-linecap="round">
      <path class="wave-flow" d="M-20 196 C 90 154, 170 238, 280 196 S 470 154, 580 196 S 760 238, 830 196"
            stroke="url(#waveFade)" stroke-width="1.6" opacity="0.9"/>
      <path class="wave-flow" style="animation-duration:13s"
            d="M-20 214 C 100 178, 190 250, 300 214 S 500 178, 610 214 S 780 250, 830 214"
            stroke="url(#waveFade)" stroke-width="1" opacity="0.45"/>
    </g>

    <!-- Bezier "creative" curves, right side -->
    <g fill="none" stroke="#00F5FF" stroke-linecap="round" opacity="0.5">
      <path class="circuit float-c" d="M706 18 C 764 40, 782 76, 764 112" stroke-width="1.2" opacity="0.6"/>
      <path class="circuit float-b" style="animation-duration:17s" d="M770 200 C 790 168, 782 140, 762 118" stroke-width="1"/>
    </g>

    <!-- Albero binario -->
    <g class="float-a">
      <g stroke="#00F5FF" stroke-width="1.1" stroke-opacity="0.42" fill="none" stroke-linecap="round">
        <path d="M668 66 L620 116 M668 66 L716 116"/>
        <path d="M620 116 L596 164 M620 116 L644 164"/>
        <path d="M716 116 L692 164 M716 116 L740 164"/>
      </g>
      <g fill="#0F2027" stroke="#00F5FF" stroke-width="1.5">
        <circle cx="668" cy="66" r="8" class="pulse-slow"/>
        <circle cx="620" cy="116" r="6.5" class="pulse" style="animation-delay:.4s"/>
        <circle cx="716" cy="116" r="6.5" class="pulse" style="animation-delay:.9s"/>
        <circle cx="596" cy="164" r="4.6" class="pulse-slow" style="animation-delay:1.3s"/>
        <circle cx="644" cy="164" r="4.6" class="pulse-slow" style="animation-delay:1.7s"/>
        <circle cx="692" cy="164" r="4.6" class="pulse-slow" style="animation-delay:2.1s"/>
        <circle cx="740" cy="164" r="4.6" class="pulse-slow" style="animation-delay:2.5s"/>
      </g>
      <circle cx="668" cy="66" r="8" fill="#00F5FF" opacity="0.28" filter="url(#microGlow)"/>
      <text class="t-meta" x="668" y="190" text-anchor="middle">O(log n)</text>
    </g>

    <!-- Floating micro-particles -->
    <g fill="#00F5FF">
      <circle cx="120" cy="52" r="1.8" class="float-a pulse" opacity="0.6"/>
      <circle cx="212" cy="30" r="1.2" class="float-b pulse-slow" opacity="0.5"/>
      <circle cx="58"  cy="132" r="1.5" class="float-c pulse" opacity="0.45" style="animation-delay:.9s"/>
      <circle cx="360" cy="42" r="1.2" class="float-b pulse-soft" opacity="0.5"/>
      <circle cx="470" cy="222" r="1.6" class="float-a pulse-slow" opacity="0.4"/>
      <circle cx="530" cy="34" r="1.3" class="float-c pulse" opacity="0.4" style="animation-delay:1.4s"/>
    </g>

    <!-- Left accent bar -->
    <g class="pulse-slow">
      <rect x="52" y="86" width="3" height="78" rx="1.5" fill="#00F5FF" filter="url(#microGlow)"/>
    </g>

    <!-- Kicker -->
    <text class="t-kicker" x="72" y="82">&lt;/&gt; ENGINEERING · CREATIVITY</text>

    <!-- Title with glow aura -->
    <g>
      <text class="t-title title-aura" x="70" y="136" fill="#00F5FF" filter="url(#softGlow)">Elia Dallanoce</text>
      <text class="t-title" x="70" y="136" fill="url(#titleFill)">Elia Dallanoce</text>
    </g>

    <!-- Animated rule under title -->
    <line class="draw-rule" x1="71" y1="154" x2="391" y2="154" stroke="url(#ruleFade)" stroke-width="2" stroke-linecap="round"/>

    <!-- Subtitle -->
    <text class="t-sub" x="71" y="184">Computer Science Engineer</text>
    <rect class="caret" x="366" y="171" width="8" height="16" fill="#00F5FF" opacity="0.85"/>

    <!-- Meta line -->
    <text class="t-meta" x="72" y="214">ALGORITHMS  ·  SYSTEM DESIGN  ·  CLEAN ARCHITECTURE</text>

    <!-- Corner brackets -->
    <g stroke="#00F5FF" stroke-width="1.4" fill="none" opacity="0.55" stroke-linecap="round">
      <path class="pulse-soft" d="M22 40 L22 22 L40 22"/>
      <path class="pulse-soft" style="animation-delay:1s" d="M778 210 L778 228 L760 228"/>
    </g>

    <!-- Light sweep -->
    <g class="sweep" opacity="0.06">
      <rect x="-120" y="-40" width="120" height="340" fill="#00F5FF" transform="skewX(-18)"/>
    </g>

    <!-- Frame -->
    <rect x="0.75" y="0.75" width="798.5" height="248.5" rx="16" fill="none" stroke="#00F5FF" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>
</svg>
